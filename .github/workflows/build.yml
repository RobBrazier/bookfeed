name: Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.ACTION_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Cache Node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Dependencies
        run: just install generate
      - name: Test
        run: just test
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: "none"
      - name: Build
        run: just build-all

  release:
    needs:
      - build
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.ACTION_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - name: Cache Node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', '**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Dependencies
        run: just install generate
      - name: Release Snapshot
        if: success() && github.ref == 'refs/heads/main'
        run: |
          just release-snapshot
          image="ghcr.io/${GITHUB_REPOSITORY@L}"
          docker tag ko.local:develop $image:develop
          docker push $image:develop --platform linux/amd64
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Release Version
        if: success() && startsWith(github.ref, 'refs/tags/')
        run: just release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs:
      - release
    runs-on: ubuntu-24.04
    if: ${{ github.repository }} == "RobBrazier/bookfeed"
    steps:
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: dokku/github-action@v1.10.0
        with:
          git_remote_url: "ssh://${DEPLOY_HOST}/${{ startsWith(github.ref, 'refs/tags/') && secrets.PROD_APPNAME || secrets.DEV_APPNAME }}"
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          deploy_docker_image: ghcr.io/robbrazier/bookfeed:${{ startsWith(github.ref, 'refs/tags/') && "latest" || "develop" }}
